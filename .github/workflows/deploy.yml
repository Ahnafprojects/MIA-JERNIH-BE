name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-main.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] \
            https://pkg.cloudflare.com/cloudflared any main" \
            | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update && sudo apt-get install -y cloudflared

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/jernih_ed25519
          chmod 600 ~/.ssh/jernih_ed25519
          cat >> ~/.ssh/config << 'EOF'
          Host ssh.ahnaf.cloud
            User jernih
            IdentityFile ~/.ssh/jernih_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Deploy
        run: |
          ssh ssh.ahnaf.cloud << 'REMOTE'
          set -e
          if [ ! -d ~/app ]; then
            git clone https://github.com/Ahnafprojects/MIA-JERNIH-BE.git ~/app
          fi
          cd ~/app
          git fetch origin main
          git reset --hard origin/main
          # Salin example jadi docker-compose.yml kalau belum ada
          if [ ! -f docker-compose.yml ]; then
            cp docker-compose.example.yml docker-compose.yml
          fi
          docker compose up -d --build
          # `< /dev/null` WAJIB pada tiap `docker compose exec -T`.
          #
          # Skrip ini dikirim lewat stdin ssh (heredoc). `exec -T` mewarisi
          # stdin yang sama dan MENELAN sisa skripnya sebagai masukan untuk
          # perintah di dalam kontainer. Selama hanya ada satu baris exec dan
          # ia yang terakhir, tidak ada yang hilang — begitu baris kedua
          # ditambahkan, baris itu tidak pernah dijalankan.
          #
          # Yang paling berbahaya: tidak ada yang gagal. `set -e` tidak
          # melihat galat, job-nya hijau, dan satu-satunya tanda adalah tabel
          # yang tetap kosong di produksi.
          docker compose exec -T app sh -c "npx prisma migrate deploy" < /dev/null
          # Mengisi tabel yang baru dibuat migrasi, kalau masih kosong.
          # Migrasi membuat `NeracaHarian`, tetapi tabel kosong membuat
          # /statistik melaporkan kehilangan air 0% — dan 0% yang salah lebih
          # merusak daripada "—" yang jujur, karena ia terbaca seperti klaim.
          # Aman diulang: berhenti tanpa menulis kalau tabelnya sudah terisi.
          # `node dist/...`, bukan `npx tsx`: image produksi menjalankan
          # `npm prune --omit=dev`, jadi tsx tidak ada di sana.
          docker compose exec -T app sh -c "node dist/prisma/isi-neraca.js" < /dev/null
          # Menambah tiket pengaduan sampai jumlahnya cukup mengisi rentang 90
          # hari di Rapor Kinerja. Tidak menghapus apa pun, dan berhenti tanpa
          # menulis begitu jumlahnya sudah mencapai target.
          docker compose exec -T app sh -c "node dist/prisma/isi-tiket.js" < /dev/null
          REMOTE
