services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jernih
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: jernih
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Tidak dipublish ke host — app akses lewat nama service "db"

  # Basis data KHUSUS TES.
  #
  # `tests/setup.ts` menunjuk postgresql://…@localhost:5435/jernih_test, tapi
  # tidak ada satu pun service yang menyediakannya dan tidak ada catatan di
  # README. Akibatnya `npm test` pada klona bersih menggagalkan 39 dari 47 tes
  # dengan galat Prisma yang tidak menyebut penyebab sebenarnya.
  #
  # Sengaja TANPA volume: isinya memang dibuang tiap kali, dan tes menyemai
  # datanya sendiri. Ada di profil "test" supaya tidak ikut naik di produksi:
  #   docker compose -f docker-compose.example.yml --profile test up -d db-test
  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: jernih
      POSTGRES_PASSWORD: jernih
      POSTGRES_DB: jernih_test
    ports:
      - "127.0.0.1:5435:5432"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5300:5300"
    environment:
      NODE_ENV: production
      PORT: 5300
      DATABASE_URL: postgresql://jernih:${DB_PASSWORD}@db:5432/jernih
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Alamat FE, dipakai menyusun tautan atur ulang sandi di email.
      # Tanpa baris ini nilainya jatuh ke bawaan http://localhost:3000 dan
      # email produksi mengirim orang ke localhost.
      APP_URL: ${APP_URL:-http://localhost:3000}
      ACCESS_TTL_MENIT: ${ACCESS_TTL_MENIT:-15}
      REFRESH_TTL_HARI: ${REFRESH_TTL_HARI:-30}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Jernih <noreply@jernih.id>}
      PAYMENT_AUTO_SETTLE: ${PAYMENT_AUTO_SETTLE:-true}
      # Rahasia tanda tangan webhook. SENGAJA tanpa nilai bawaan: kalau kosong,
      # POST /api/pembayaran/webhook menolak semua permintaan. Untuk demo yang
      # memakai PAYMENT_AUTO_SETTLE=true, webhook memang tidak pernah dipanggil.
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      # Token demo firmware 1111/2222 lewat API. Bawaannya mati; nyalakan hanya
      # di lingkungan peragaan, karena token ini bisa ditukar berulang kali.
      DEMO_TOKEN_ENABLED: ${DEMO_TOKEN_ENABLED:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-admin123}
      # Kunci enkripsi kode token. Tanpa ini token tetap terbit, hanya
      # kodenya tidak bisa dibacakan ulang ke pemiliknya — jadi halaman
      # pembayaran berhasil dan riwayat tidak akan pernah menampilkannya.
      #
      # WAJIB disebut di sini. Blok `environment:` meneruskan variabel satu
      # per satu, jadi mengisi `.env` saja TIDAK cukup: nilainya mendarat di
      # host tetapi tidak pernah masuk ke kontainer. Dibuktikan di produksi —
      # kunci terpasang di `.env`, `printenv TOKEN_ENC_KEY` di dalam
      # kontainer mengembalikan kosong, dan token yang terbit sesudahnya
      # dijawab `KODE_TIDAK_TERSIMPAN`.
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY:-}
      # Layanan notifikasi. Nama host `notifikasi` adalah nama layanan di
      # bawah; resolusinya lewat jaringan Docker, bukan lewat internet.
      NOTIFIKASI_URL: ${NOTIFIKASI_URL:-http://notifikasi:5310}
      NOTIFIKASI_SECRET: ${NOTIFIKASI_SECRET:-}
      # Channel pengumuman, mis. @JernihInfo. Kosongkan bila tidak ada.
      # Bot harus dijadikan admin channel itu agar boleh mengirim.
      TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL:-}
    depends_on:
      - db

  # ── Pengirim notifikasi WhatsApp dan Telegram ──────────────────────────
  #
  # Dipisah dari `app` dengan sengaja. Soket WhatsApp memegang sesi yang
  # hidup terus dan bisa menggantung puluhan detik saat menyambung ulang;
  # kalau ia tinggal di dalam proses API, setiap penyambungan ulangnya ikut
  # menahan permintaan HTTP milik warga.
  #
  # TIDAK PERNAH diekspos ke internet. Tidak ada entri cloudflared untuk
  # port ini, dan portnya diikat ke 127.0.0.1 saja. Endpoint `/qr` di
  # dalamnya memasangkan PERANGKAT BARU pada nomor WhatsApp tim: siapa pun
  # yang bisa memindainya bisa membaca dan mengirim pesan atas nama nomor
  # itu.
  notifikasi:
    build: ./services/notifikasi
    restart: unless-stopped
    ports:
      - "127.0.0.1:5310:5310"
    environment:
      NODE_ENV: production
      PORT: 5310
      # Rahasia yang sama dengan yang dipakai `app` di atas. Sengaja tanpa
      # nilai bawaan: layanannya berhenti kalau kosong, supaya kegagalannya
      # terlihat saat menyalakan, bukan nanti saat ada pesan yang hilang.
      NOTIFIKASI_SECRET: ${NOTIFIKASI_SECRET:-}
      # Kosongkan untuk mematikan Telegram. Token dari @BotFather.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WA_AKTIF: ${WA_AKTIF:-true}
      WA_SESI_DIR: /data/wa-sesi
      JEDA_KIRIM_MS: ${JEDA_KIRIM_MS:-2500}
      # Salinan antrean pesan, di volume yang sama dengan sesi WhatsApp,
      # supaya pesan yang belum terkirim bertahan melewati penyebaran.
      ANTREAN_BERKAS: /data/antrean.json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # WAJIB. Kredensial pemasangan WhatsApp tinggal di sini; tanpa volume
      # setiap penyebaran menghapusnya dan menuntut pemindaian QR ulang,
      # padahal penyebaran terjadi pada setiap push ke `main`.
      - wa-sesi:/data
    # Swap server ini sudah terpakai 2 GB. Batas memori dipasang supaya satu
    # kebocoran di pustaka WhatsApp tidak menyeret seluruh host.
    mem_limit: 512m

volumes:
  pgdata:
  wa-sesi:
